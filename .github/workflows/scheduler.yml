name: Campaign scheduler

# Starts due campaigns and sends the next batches by calling /api/cron.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   APP_URL      e.g. https://campaign-seven-ruddy.vercel.app
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    # Only the repo Vercel deploys from runs the scheduler, so the mirror (Rensog878/campaign)
    # doesn't fail every 5 minutes or call /api/cron a second time.
    if: github.repository == 'thabaal26/thabaal'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the scheduler
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron"
