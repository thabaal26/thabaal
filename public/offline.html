<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#171b24" />
<title>You're offline · Campaigns</title>
<style>
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f5f7fa; color: #111827;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 320px; text-align: center; }
  .icon { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 12px; background: #167d63; display: grid; place-items: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #667085; margin: 0 0 24px; }
  button { width: 100%; height: 48px; border: 0; border-radius: 8px; background: #167d63; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:active { background: #11634f; }
  button:focus-visible { outline: 2px solid #11634f; outline-offset: 2px; }
  body { padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></div>
  <h1>You're offline</h1>
  <p>Campaigns keep sending on the server. Reconnect to see the latest messages.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
